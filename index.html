<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God and the Goat | 神与山羊</title>
    <script src="https://openfpcdn.io/fingerprintjs/v3/umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh; width: 100vw;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%), url('/static/bg.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
            color: #fff; overflow: hidden; position: relative;
        }

        .landing-container {
            height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        h1.art-title {
            font-size: 4.5rem; font-weight: 800; letter-spacing: 5px; margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }
        p.subtitle { font-size: 1.4rem; color: rgba(255, 255, 255, 0.85); margin-bottom: 45px; letter-spacing: 6px; }
        .btn {
            padding: 14px 42px; font-size: 1.05rem; font-weight: 500; color: #0f172a;
            border: none; cursor: pointer; border-radius: 50px;
            background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 100%);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5); transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px; padding: 35px 30px; width: 90%; max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: left; position: relative;
        }
        .modal-title { font-size: 1.5rem; text-align: center; color: #d4af37; margin-bottom: 6px; }
        .modal-subtitle { font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; color: #d4af37; margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 8px; color: #fff; outline: none;
        }
        .submit-btn {
            width: 100%; padding: 13px; margin-top: 10px;
            background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 100%);
            color: #0f172a; border: none; border-radius: 50px; font-weight: bold; cursor: pointer;
        }
        .msg-box { font-size: 0.85rem; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; }
        .msg-box.error { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .msg-box.success { background: rgba(34, 197, 94, 0.15); color: #4ade80; }

        .main-dashboard {
            display: none; height: 100%; width: 100%; padding: 40px;
            flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .main-dashboard.active { display: flex; }

        .user-profile-bar {
            position: absolute; top: 25px; right: 35px;
            display: flex; align-items: center; gap: 15px;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 40px;
            padding: 6px 18px 6px 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); cursor: pointer;
            transition: all 0.2s;
        }
        .user-profile-bar:hover { border-color: #d4af37; background: rgba(255, 255, 255, 0.12); }
        .avatar-wrapper {
            position: relative; width: 44px; height: 44px; border-radius: 50%;
            overflow: hidden; border: 2px solid #d4af37; flex-shrink: 0;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1/1; }
        .avatar-hover-tip {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; color: #fff; opacity: 0; transition: opacity 0.2s;
        }
        .avatar-wrapper:hover .avatar-hover-tip { opacity: 1; }
        #avatar-file-input, #album-file-input { display: none; }
        
        .user-details { text-align: right; }
        .user-nickname { font-weight: bold; color: #fbf5b7; font-size: 0.95rem; }
        .user-role-tag { font-size: 0.7rem; color: #d4af37; border: 1px solid #d4af37; border-radius: 4px; padding: 0 4px; margin-left: 4px; }
        .user-race { font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); }

        .grid-menu {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
            width: 100%; max-width: 900px; margin-top: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px;
            padding: 30px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-decoration: none; color: #fff;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(212, 175, 55, 0.6);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2);
        }
        .glass-card.large { grid-column: span 2; height: 180px; }
        .glass-card.medium { grid-column: span 1; height: 180px; }
        .glass-card.small { grid-column: span 1; height: 130px; }
        
        .card-icon { font-size: 2.2rem; margin-bottom: 10px; }
        .card-title { font-size: 1.3rem; font-weight: 600; color: #fbf5b7; letter-spacing: 2px; }
        .card-desc { font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); margin-top: 6px; }

        /* 论坛 */
        .forum-modal {
            position: fixed; inset: 0; background: rgba(11, 15, 25, 0.92);
            backdrop-filter: blur(12px); z-index: 10000; display: none;
            flex-direction: column; padding: 30px;
        }
        .forum-modal.active { display: flex; }
        .forum-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 15px; margin-bottom: 20px;
        }
        .forum-title { font-size: 1.6rem; color: #d4af37; }
        .close-btn { font-size: 1.8rem; cursor: pointer; color: #aaa; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }

        .forum-body { flex: 1; overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; gap: 16px; }
        .post-item {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 14px 18px; display: flex; gap: 15px; align-items: flex-start;
        }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; cursor: pointer; }
        .post-content-box { flex: 1; text-align: left; }
        .post-meta { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .post-author { font-size: 0.9rem; font-weight: bold; color: #fbf5b7; cursor: pointer; }
        .post-time { font-size: 0.75rem; color: #777; }
        .post-text { font-size: 0.95rem; color: #ddd; line-height: 1.4; }
        
        .admin-action-btn {
            font-size: 0.75rem; color: #ef4444; border: 1px solid #ef4444; border-radius: 4px;
            padding: 2px 6px; cursor: pointer; margin-left: 8px; transition: all 0.2s;
        }
        .admin-action-btn:hover { background: #ef4444; color: #fff; }

        .forum-footer { margin-top: 15px; display: flex; gap: 12px; }
        .forum-input {
            flex: 1; padding: 14px 18px; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 30px;
            color: #fff; outline: none; font-size: 0.95rem;
        }
        .send-btn {
            padding: 0 28px; background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 100%);
            color: #0f172a; border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
        }

        /* 相册样式 */
        .album-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
            max-height: 350px; overflow-y: auto; margin-top: 15px;
        }
        .album-item {
            width: 100%; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3); position: relative;
        }
        .album-item img { width: 100%; height: 100%; object-fit: cover; }
        .album-del-btn {
            position: absolute; top: 5px; right: 5px; background: rgba(239, 68, 68, 0.85);
            color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px;
            cursor: pointer; font-size: 0.8rem; display: flex; justify-content: center; align-items: center;
        }

        /* 个人卡片与超级管理员管理权 */
        .profile-modal-card { text-align: center; }
        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #d4af37; margin: 0 auto 15px; object-fit: cover; }
        .profile-info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .profile-info-label { color: #d4af37; }
        .profile-info-val { color: #eee; }

        .prologue-overlay {
            position: fixed; inset: 0; background: #000; z-index: 20000;
            display: none; flex-direction: column; justify-content: flex-end; padding: 40px;
        }
        .prologue-overlay.active { display: flex; }
        .dialog-box {
            background: rgba(15, 23, 42, 0.9); border: 2px solid #d4af37;
            border-radius: 16px; padding: 25px; width: 100%; max-width: 900px; margin: 0 auto;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); text-align: left;
        }
        .speaker-name { font-size: 1.2rem; color: #d4af37; font-weight: bold; margin-bottom: 10px; }
        .dialog-text { font-size: 1.1rem; line-height: 1.6; color: #f0f0f0; min-height: 60px; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .dialog-opt-btn {
            padding: 12px 20px; background: rgba(212, 175, 55, 0.1); border: 1px solid #d4af37;
            color: #fbf5b7; border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .dialog-opt-btn:hover { background: rgba(212, 175, 55, 0.3); transform: translateX(5px); }
    </style>
</head>
<body>

    <!-- 1. 落地页 -->
    <div id="landing-page" class="landing-container">
        <h1 class="art-title">God and the Goat</h1>
        <p class="subtitle">神 与 山 羊</p>
        <button class="btn" onclick="openRegister()">探索序章 <span style="margin-left: 6px;">→</span></button>
    </div>

    <!-- 2. 契约注册 -->
    <div id="register-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 class="modal-title">神与羊：序章契约</h2>
        <p class="modal-subtitle">单台设备仅可绑定一个灵魂契约</p>
        <form id="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="reg-nickname">灵魂昵称</label>
            <input type="text" id="reg-nickname" placeholder="请输入唯一昵称" required maxlength="16" />
          </div>
          <div class="form-group">
            <label for="reg-race">所属种族</label>
            <select id="reg-race" required>
              <option value="" disabled selected>-- 请选择你的阵营/种族 --</option>
              <option value="天堂">天堂 (Heaven)</option>
              <option value="人间">人间 (Mortal)</option>
              <option value="地狱">地狱 (Hell)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-email">灵魂邮箱</label>
            <input type="email" id="reg-email" placeholder="name@example.com" required />
          </div>
          <div id="modal-msg" class="msg-box" style="display:none;"></div>
          <button type="submit" id="submit-btn" class="submit-btn">签订契约并进入</button>
        </form>
      </div>
    </div>

    <!-- 3. 主控制台菜单 -->
    <div id="main-dashboard" class="main-dashboard">
        <div class="user-profile-bar" onclick="openProfileCard(currentUser.nickname)">
            <div class="user-details">
                <div class="user-nickname"><span id="user-nickname-display">玩家昵称</span><span id="role-tag-display" class="user-role-tag" style="display:none;">管理员</span></div>
                <div id="user-race-display" class="user-race">种族</div>
            </div>
            <div class="avatar-wrapper" onclick="event.stopPropagation(); triggerAvatarUpload();">
                <img id="user-avatar-img" class="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=goat" />
                <div class="avatar-hover-tip">修改</div>
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" onchange="handleAvatarChange(event)" />
            <input type="file" id="album-file-input" accept="image/*" onchange="handleAlbumUpload(event)" />
        </div>

        <div class="grid-menu">
            <div class="glass-card large" onclick="openForum()">
                <div class="card-icon">🏛️</div>
                <div class="card-title">万神圣坛 · 论坛</div>
                <div class="card-desc">全服言论集散地（支持管理员撤回/禁言）</div>
            </div>
            <div class="glass-card medium" onclick="openAlbumModal(currentUser.nickname)">
                <div class="card-icon">🖼️</div>
                <div class="card-title">灵魂相册</div>
                <div class="card-desc">浏览与管理回忆相册</div>
            </div>
            <div class="glass-card small" onclick="startPrologueGame(true)">
                <div class="card-icon">📜</div>
                <div class="card-title">重温序章</div>
            </div>
            <div class="glass-card small" onclick="alert('阵营图鉴整理中...')">
                <div class="card-icon">⚔️</div>
                <div class="card-title">阵营圣典</div>
            </div>
            <div class="glass-card small" onclick="alert('系统设置开发中...')">
                <div class="card-icon">⚙️</div>
                <div class="card-title">系统设置</div>
            </div>
        </div>
    </div>

    <!-- 4. 论坛弹窗 -->
    <div id="forum-modal" class="forum-modal">
        <div class="forum-header">
            <div class="forum-title">🏛️ 万神圣坛论坛</div>
            <div class="close-btn" onclick="closeForum()">&times;</div>
        </div>
        <div id="forum-body" class="forum-body"></div>
        <div class="forum-footer">
            <input type="text" id="forum-input" class="forum-input" placeholder="撰写你的发言（CD: 5秒）..." maxlength="100" />
            <button id="send-btn" class="send-btn" onclick="sendPost()">发送</button>
        </div>
    </div>

    <!-- 5. 灵魂相册弹窗 (所有所有人可查看，仅主人与超级管理员可删除/上传) -->
    <div id="album-modal" class="modal-overlay">
        <div class="modal-card" style="max-width: 500px;">
            <div class="close-btn" style="position:absolute; top:15px; right:20px;" onclick="closeAlbumModal()">&times;</div>
            <h2 id="album-title" class="modal-title">🖼️ 灵魂相册</h2>
            <p id="album-subtitle" class="modal-subtitle">公开相册展示</p>
            <button id="album-upload-btn" class="submit-btn" style="margin-bottom: 15px; display:none;" onclick="triggerAlbumUpload()">+ 上传新照片</button>
            <div id="album-grid" class="album-grid"></div>
        </div>
    </div>

    <!-- 6. 个人中心卡片与超级管理员管理处 -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-card profile-modal-card">
            <div class="close-btn" style="position:absolute; top:15px; right:20px;" onclick="closeProfileCard()">&times;</div>
            <img id="pf-avatar" class="profile-avatar-large" src="" />
            <h3 id="pf-nickname" style="color:#d4af37; margin-bottom:15px;">-</h3>
            
            <div class="profile-info-row">
                <span class="profile-info-label">权限级别</span>
                <span id="pf-role" class="profile-info-val">-</span>
            </div>
            <div class="profile-info-row">
                <span class="profile-info-label">契约阵营</span>
                <span id="pf-race" class="profile-info-val">-</span>
            </div>

            <!-- 超级管理员独占：一键清除该玩家违规头像按纽 -->
            <button id="super-admin-reset-avatar-btn" class="submit-btn" style="background:#ef4444; color:#fff; display:none; margin-top:12px; padding:8px;" onclick="superAdminResetAvatar()">🚨 强行重置该玩家违规头像</button>

            <!-- 超级管理员授权操作区域 -->
            <div id="super-admin-panel" style="display:none; margin-top:15px;">
                <input type="text" id="target-user-input" placeholder="输入玩家昵称" style="width:100%; padding:8px; margin-bottom:8px; background:rgba(255,255,255,0.1); border:1px solid #d4af37; color:#fff; border-radius:6px;" />
                <button onclick="toggleAdminRole()" class="submit-btn" style="padding:8px;">赋予 / 撤销 管理员权限</button>
            </div>
        </div>
    </div>

    <!-- 7. 强制序章界面 -->
    <div id="prologue-modal" class="prologue-overlay">
        <div id="prologue-skip-btn" class="close-btn" style="position:absolute; top:25px; right:35px; z-index:20001; display:none;" onclick="exitPrologue()">&times; 退出序章</div>
        <div class="dialog-box">
            <div id="speaker-name" class="speaker-name">神秘声音</div>
            <div id="dialog-text" class="dialog-text">...</div>
            <div id="options-container" class="options-container"></div>
        </div>
    </div>

    <script>
        // 绝对超级管理员昵称 (修改为你自己的昵称)
        const SUPER_ADMIN_NAME = "河彩蝶"; 

        let deviceVisitorId = "";
        let currentUser = null;
        let currentViewingAlbumUser = ""; // 当前正在查看谁的相册
        let currentViewingProfileUser = ""; // 当前正在查看谁的资料卡
        let lastPostTime = 0;
        const DEFAULT_AVATAR = "https://api.dicebear.com/7.x/bottts/svg?seed=goat";

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                deviceVisitorId = result.visitorId;
            } catch (e) {}

            const savedUser = localStorage.getItem('soul_contract');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                checkUserRole();
                
                if (!currentUser.hasFinishedPrologue) {
                    startPrologueGame(false);
                } else {
                    enterDashboard();
                }
            }
        });

        function checkUserRole() {
            const adminList = JSON.parse(localStorage.getItem('admin_list') || '[]');
            if (currentUser.nickname === SUPER_ADMIN_NAME) {
                currentUser.role = 'SUPER_ADMIN';
            } else if (adminList.includes(currentUser.nickname)) {
                currentUser.role = 'ADMIN';
            } else {
                currentUser.role = 'USER';
            }
        }

        function openRegister() {
            if (currentUser) {
                if (!currentUser.hasFinishedPrologue) startPrologueGame(false);
                else enterDashboard();
                return;
            }
            document.getElementById('register-modal').classList.add('active');
        }

        function showModalMsg(text, type = 'error') {
            const msgEl = document.getElementById('modal-msg');
            msgEl.innerText = text;
            msgEl.className = `msg-box ${type}`;
            msgEl.style.display = 'block';
        }

        function handleRegister(event) {
            event.preventDefault();
            const nickname = document.getElementById('reg-nickname').value.trim();
            const race = document.getElementById('reg-race').value;
            const email = document.getElementById('reg-email').value.trim();

            if (!nickname || !race || !email) { showModalMsg('请完整填写！', 'error'); return; }

            const deviceId = deviceVisitorId || localStorage.getItem('backup_device_id') || Math.random().toString(36).substring(2);
            localStorage.setItem('backup_device_id', deviceId);

            currentUser = { 
                nickname, race, email, deviceId, 
                avatar: DEFAULT_AVATAR, 
                hasFinishedPrologue: false,
                album: [] 
            };
            checkUserRole();
            localStorage.setItem('soul_contract', JSON.stringify(currentUser));

            showModalMsg('契约签订成功！即将开启序章试炼...', 'success');
            setTimeout(() => {
                document.getElementById('register-modal').classList.remove('active');
                startPrologueGame(false);
            }, 1000);
        }

        function enterDashboard() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('main-dashboard').classList.add('active');
            document.getElementById('user-nickname-display').innerText = currentUser.nickname;
            document.getElementById('user-race-display').innerText = `阵营: ${currentUser.race}`;
            document.getElementById('user-avatar-img').src = currentUser.avatar || DEFAULT_AVATAR;

            const tagEl = document.getElementById('role-tag-display');
            if (currentUser.role === 'SUPER_ADMIN') {
                tagEl.innerText = '超级主神'; tagEl.style.display = 'inline-block';
            } else if (currentUser.role === 'ADMIN') {
                tagEl.innerText = '管理者'; tagEl.style.display = 'inline-block';
            } else {
                tagEl.style.display = 'none';
            }
        }

        /* ====== 公开相册与权限控制 ====== */
        function openAlbumModal(targetNickname) {
            currentViewingAlbumUser = targetNickname || currentUser.nickname;
            renderAlbum();
            document.getElementById('album-modal').classList.add('active');
        }
        function closeAlbumModal() { document.getElementById('album-modal').classList.remove('active'); }
        function triggerAlbumUpload() { document.getElementById('album-file-input').click(); }

        function handleAlbumUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (!currentUser.album) currentUser.album = [];
                    currentUser.album.push(e.target.result);
                    localStorage.setItem('soul_contract', JSON.stringify(currentUser));
                    
                    // 同步存储全局相册集
                    let allAlbums = JSON.parse(localStorage.getItem('all_user_albums') || '{}');
                    allAlbums[currentUser.nickname] = currentUser.album;
                    localStorage.setItem('all_user_albums', JSON.stringify(allAlbums));

                    renderAlbum();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderAlbum() {
            const isOwner = (currentViewingAlbumUser === currentUser.nickname);
            const isSuperAdmin = (currentUser.role === 'SUPER_ADMIN');

            document.getElementById('album-title').innerText = `🖼️ ${currentViewingAlbumUser} 的灵魂相册`;
            document.getElementById('album-subtitle').innerText = isOwner ? '你可以自由管理与上传你的相册照片' : '公开照片浏览';
            
            // 只有本人可以上传
            document.getElementById('album-upload-btn').style.display = isOwner ? 'block' : 'none';

            let allAlbums = JSON.parse(localStorage.getItem('all_user_albums') || '{}');
            let albumList = isOwner ? (currentUser.album || []) : (allAlbums[currentViewingAlbumUser] || []);

            const grid = document.getElementById('album-grid');
            grid.innerHTML = '';

            if (albumList.length === 0) {
                grid.innerHTML = '<div style="grid-column:span 3; color:#888; font-size:0.85rem; padding:20px;">相册暂无任何照片</div>';
                return;
            }

            albumList.forEach((imgSrc, idx) => {
                // 本人可删除，超级管理员也可强行删除其他人照片
                const showDelBtn = isOwner || isSuperAdmin;
                const delBtnHTML = showDelBtn ? `<button class="album-del-btn" onclick="deleteAlbumImg(${idx})">&times;</button>` : '';

                grid.innerHTML += `
                    <div class="album-item">
                        <img src="${imgSrc}" />
                        ${delBtnHTML}
                    </div>
                `;
            });
        }

        function deleteAlbumImg(idx) {
            let allAlbums = JSON.parse(localStorage.getItem('all_user_albums') || '{}');
            const isOwner = (currentViewingAlbumUser === currentUser.nickname);

            if (isOwner) {
                currentUser.album.splice(idx, 1);
                localStorage.setItem('soul_contract', JSON.stringify(currentUser));
                allAlbums[currentUser.nickname] = currentUser.album;
            } else {
                if (allAlbums[currentViewingAlbumUser]) {
                    allAlbums[currentViewingAlbumUser].splice(idx, 1);
                }
            }
            localStorage.setItem('all_user_albums', JSON.stringify(allAlbums));
            renderAlbum();
        }

        /* 个人中心卡片与超级管理员强行重置头像 */
        function openProfileCard(targetNickname) {
            currentViewingProfileUser = targetNickname || currentUser.nickname;
            const isOwner = (currentViewingProfileUser === currentUser.nickname);
            const isSuperAdmin = (currentUser.role === 'SUPER_ADMIN');

            let allUsers = JSON.parse(localStorage.getItem('all_user_profiles') || '{}');
            let profileData = isOwner ? currentUser : (allUsers[targetNickname] || { nickname: targetNickname, race: '未知', avatar: DEFAULT_AVATAR });

            document.getElementById('pf-avatar').src = profileData.avatar || DEFAULT_AVATAR;
            document.getElementById('pf-nickname').innerText = profileData.nickname;
            document.getElementById('pf-race').innerText = profileData.race;
            
            const roleName = profileData.nickname === SUPER_ADMIN_NAME ? '超级主神' : '灵魂玩家';
            document.getElementById('pf-role').innerText = roleName;

            // 超级管理员删除他人违规头像的按纽
            const resetBtn = document.getElementById('super-admin-reset-avatar-btn');
            if (isSuperAdmin && !isOwner) {
                resetBtn.style.display = 'block';
            } else {
                resetBtn.style.display = 'none';
            }

            if (isSuperAdmin && isOwner) {
                document.getElementById('super-admin-panel').style.display = 'block';
            } else {
                document.getElementById('super-admin-panel').style.display = 'none';
            }

            document.getElementById('profile-modal').classList.add('active');
        }
        function closeProfileCard() { document.getElementById('profile-modal').classList.remove('active'); }

        // 超级管理员强行清除违规头像
        function superAdminResetAvatar() {
            if (currentUser.role !== 'SUPER_ADMIN') return;
            let allUsers = JSON.parse(localStorage.getItem('all_user_profiles') || '{}');
            if (allUsers[currentViewingProfileUser]) {
                allUsers[currentViewingProfileUser].avatar = DEFAULT_AVATAR;
                localStorage.setItem('all_user_profiles', JSON.stringify(allUsers));
            }
            document.getElementById('pf-avatar').src = DEFAULT_AVATAR;
            alert(`已强制清除玩家 ${currentViewingProfileUser} 的违规头像！`);
        }

        function toggleAdminRole() {
            const targetName = document.getElementById('target-user-input').value.trim();
            if (!targetName) return alert('请输入玩家昵称！');
            let adminList = JSON.parse(localStorage.getItem('admin_list') || '[]');

            if (adminList.includes(targetName)) {
                adminList = adminList.filter(name => name !== targetName);
                alert(`已撤销 ${targetName} 的管理员权限！`);
            } else {
                adminList.push(targetName);
                alert(`已成功赋予 ${targetName} 管理员权限！`);
            }
            localStorage.setItem('admin_list', JSON.stringify(adminList));
            document.getElementById('target-user-input').value = '';
        }

        /* 论坛与管理按纽 */
        function openForum() { renderPosts(); document.getElementById('forum-modal').classList.add('active'); }
        function closeForum() { document.getElementById('forum-modal').classList.remove('active'); }

        function renderPosts() {
            const posts = JSON.parse(localStorage.getItem('forum_posts') || '[]');
            const body = document.getElementById('forum-body');
            body.innerHTML = `
                <div class="post-item">
                    <img class="post-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=god" />
                    <div class="post-content-box">
                        <div class="post-meta">
                            <span class="post-author">创世神谕 [系统]</span>
                            <span class="post-time">系统广播</span>
                        </div>
                        <div class="post-text">点击玩家头像可公开查看其个人卡片或相册！</div>
                    </div>
                </div>
            `;
            const isManager = (currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'ADMIN');

            posts.forEach((p, idx) => {
                const adminControls = isManager ? `
                    <span class="admin-action-btn" onclick="deletePost(${idx})">撤回</span>
                    <span class="admin-action-btn" onclick="muteUser('${p.nickname}')">禁言5m</span>
                ` : '';

                body.insertAdjacentHTML('beforeend', `
                    <div class="post-item">
                        <img class="post-avatar" src="${p.avatar || DEFAULT_AVATAR}" onclick="openAlbumModal('${p.nickname}')" title="查看该玩家相册" />
                        <div class="post-content-box">
                            <div class="post-meta">
                                <span class="post-author" onclick="openProfileCard('${p.nickname}')">${escapeHtml(p.nickname)} (${p.race})</span> ${adminControls}
                                <span class="post-time">${p.time}</span>
                            </div>
                            <div class="post-text">${escapeHtml(p.text)}</div>
                        </div>
                    </div>
                `);
            });
            body.scrollTop = body.scrollHeight;
        }

        function deletePost(idx) {
            let posts = JSON.parse(localStorage.getItem('forum_posts') || '[]');
            posts.splice(idx, 1);
            localStorage.setItem('forum_posts', JSON.stringify(posts));
            renderPosts();
        }

        function muteUser(targetNickname) {
            let muteMap = JSON.parse(localStorage.getItem('mute_map') || '{}');
            muteMap[targetNickname] = Date.now() + 5 * 60 * 1000;
            localStorage.setItem('mute_map', JSON.stringify(muteMap));
            alert(`玩家 ${targetNickname} 已被禁言 5 分钟！`);
        }

        function sendPost() {
            const input = document.getElementById('forum-input');
            const text = input.value.trim();
            if (!text) return;

            let muteMap = JSON.parse(localStorage.getItem('mute_map') || '{}');
            if (muteMap[currentUser.nickname] && Date.now() < muteMap[currentUser.nickname]) {
                const remaining = Math.ceil((muteMap[currentUser.nickname] - Date.now()) / 1000 / 60);
                alert(`你已被管理员禁言，还剩 ${remaining} 分钟解封！`);
                return;
            }

            const now = Date.now();
            if (now - lastPostTime < 5000) {
                alert(`发言过于频繁，请等待 ${Math.ceil((5000 - (now - lastPostTime)) / 1000)} 秒！`);
                return;
            }
            lastPostTime = now;

            const posts = JSON.parse(localStorage.getItem('forum_posts') || '[]');
            posts.push({
                nickname: currentUser.nickname,
                race: currentUser.race,
                avatar: currentUser.avatar,
                text: text,
                time: new Date().toLocaleTimeString()
            });
            localStorage.setItem('forum_posts', JSON.stringify(posts));

            input.value = '';
            renderPosts();
        }

        /* 序章对话系统 */
        const storyData = {
            start: {
                speaker: "未知迷雾",
                text: "醒来吧，来自...的灵魂。你睁开眼，面前站着一只头顶长着金色羊角、散发着幽光的山羊。",
                options: [
                    { label: "你是谁？这里是什么地方？", next: "step1" },
                    { label: "（保持警惕，紧握双拳）", next: "step2" }
                ]
            },
            step1: {
                speaker: "神秘山羊",
                text: "我是这片原野的引导者。神已沉睡，而世界的秩序正在崩塌...",
                options: [
                    { label: "作为【阵营】的一员，我要重建这片大地！", next: "end" }
                ]
            },
            step2: {
                speaker: "神秘山羊",
                text: "不必戒备，凡人。你的灵魂契约早已注定了你的归宿。",
                options: [
                    { label: "顺应契约的召唤", next: "end" }
                ]
            },
            end: {
                speaker: "创世神谕",
                text: "【序章契约试炼完成】你的选择已印入这片土地！",
                options: [
                    { label: "完成试炼并进入主菜单", next: "finish" }
                ]
            }
        };

        function startPrologueGame(canSkipManual = false) {
            document.getElementById('prologue-skip-btn').style.display = canSkipManual ? 'block' : 'none';
            document.getElementById('prologue-modal').classList.add('active');
            renderDialogue('start');
        }
        function exitPrologue() { 
            document.getElementById('prologue-modal').classList.remove('active');
            enterDashboard();
        }

        function renderDialogue(nodeKey) {
            if (nodeKey === 'finish') {
                currentUser.hasFinishedPrologue = true;
                localStorage.setItem('soul_contract', JSON.stringify(currentUser));
                exitPrologue();
                return;
            }
            const node = storyData[nodeKey];
            let text = node.text.replace('来自...', `来自【${currentUser.race}】`);
            text = text.replace('【阵营】', currentUser.race);

            document.getElementById('speaker-name').innerText = node.speaker;
            document.getElementById('dialog-text').innerText = text;

            const optBox = document.getElementById('options-container');
            optBox.innerHTML = '';
            node.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'dialog-opt-btn';
                btn.innerText = opt.label;
                btn.onclick = () => renderDialogue(opt.next);
                optBox.appendChild(btn);
            });
        }

        function triggerAvatarUpload() { document.getElementById('avatar-file-input').click(); }
        function handleAvatarChange(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUser.avatar = e.target.result;
                    localStorage.setItem('soul_contract', JSON.stringify(currentUser));
                    document.getElementById('user-avatar-img').src = e.target.result;

                    // 同步存储全局用户信息
                    let allUsers = JSON.parse(localStorage.getItem('all_user_profiles') || '{}');
                    allUsers[currentUser.nickname] = currentUser;
                    localStorage.setItem('all_user_profiles', JSON.stringify(allUsers));
                };
                reader.readAsDataURL(file);
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
