<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God and the Goat | 神与山羊</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%), url('/static/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Georgia", serif;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1.art-title {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: 5px;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4)) drop-shadow(0 8px 16px rgba(0, 0, 0, 0.9));
        }

        p.subtitle {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 45px;
            font-weight: 300;
            letter-spacing: 6px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 42px;
            font-size: 1.05rem;
            font-weight: 500;
            color: #0f172a;
            text-decoration: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 100%);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #ffffff 0%, #fbf5b7 100%);
        }
    </style>
</head>
<body>
    <h1 class="art-title">God and the Goat</h1>
    <p class="subtitle">神 与 山 羊</p>
    <a href="javascript:void(0)" onclick="alert('欢迎来到《God and the Goat》的序章世界！')" class="btn">探索序章 <span>→</span></a>
</body>
</html>
