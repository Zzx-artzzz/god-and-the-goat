<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God and the Goat | 神 与 羊</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh; width: 100vw;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%), url('/static/bg.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
            color: #fff; overflow: hidden; position: relative;
        }

        /* 1. 落地首页 */
        .landing-container {
            height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        h1.art-title {
            font-size: 4.5rem; font-weight: 800; letter-spacing: 5px; margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }
        p.subtitle { font-size: 1.4rem; color: rgba(255, 255, 255, 0.85); margin-bottom: 45px; letter-spacing: 6px; }
        .btn {
            padding: 14px 42px; font-size: 1.05rem; font-weight: 500; color: #0f172a;
            border: none; cursor: pointer; border-radius: 50px;
            background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 100%);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5); transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5); }

        /* 弹窗通用结构 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px; padding: 30px; width: 90%; max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: left; position: relative;
        }
        .modal-title { font-size: 1.5rem; text-align: center; color: #d4af37; margin-bottom: 6px; }
        .modal-subtitle { font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: #d4af37; margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 8px; color: #fff; outline: none;
        }
        .submit-btn {
            width: 100%; padding: 12px; margin-top: 10px;
            background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 100%);
            color: #0f172a; border: none; border-radius: 50px; font-weight: bold; cursor: pointer;
        }
        .msg-box { font-size: 0.85rem; padding: 10px; border-radius: 6px; margin-bottom: 12px; text-align: center; }
        .msg-box.error { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .msg-box.success { background: rgba(34, 197, 94, 0.15); color: #4ade80; }

        /* 2. 主控制台界面 */
        .main-dashboard {
            display: none; height: 100%; width: 100%; padding: 40px;
            flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .main-dashboard.active { display: flex; }

        /* 右上角玩家名牌栏 */
        .user-profile-bar {
            position: absolute; top: 25px; right: 35px;
            display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 40px;
            padding: 6px 18px 6px 10px; cursor: pointer;
        }
        .avatar-wrapper {
            position: relative; width: 44px; height: 44px; border-radius: 50%;
            overflow: hidden; border: 2px solid #d4af37; flex-shrink: 0;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1/1; }
        .avatar-hover-tip {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; color: #fff; opacity: 0; transition: opacity 0.2s;
        }
        .avatar-wrapper:hover .avatar-hover-tip { opacity: 1; }
        #avatar-file-input, #album-file-input { display: none; }

        .user-details { text-align: right; }
        .user-nickname { font-weight: bold; color: #fbf5b7; font-size: 0.95rem; }
        .user-role-tag { font-size: 0.7rem; color: #d4af37; border: 1px solid #d4af37; border-radius: 4px; padding: 0 4px; margin-left: 4px; }
        .user-race { font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); }

        /* 毛玻璃方块网格 */
        .grid-menu {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
            width: 100%; max-width: 900px; margin-top: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px;
            padding: 25px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s; color: #fff; text-align: center;
        }
        .glass-card:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(212, 175, 55, 0.6); transform: translateY(-5px); }
        .glass-card.large { grid-column: span 2; height: 170px; }
        .glass-card.medium { grid-column: span 1; height: 170px; }
        .glass-card.small { grid-column: span 1; height: 125px; }
        .card-icon { font-size: 2.2rem; margin-bottom: 8px; }
        .card-title { font-size: 1.2rem; font-weight: 600; color: #fbf5b7; }
        .card-desc { font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); margin-top: 4px; }

        /* 3. 论坛与消息流 */
        .forum-modal {
            position: fixed; inset: 0; background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(12px); z-index: 10000; display: none;
            flex-direction: column; padding: 30px;
        }
        .forum-modal.active { display: flex; }
        .forum-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 15px; margin-bottom: 20px;
        }
        .forum-title { font-size: 1.5rem; color: #d4af37; }
        .close-btn { font-size: 1.8rem; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #fff; }

        .forum-body { flex: 1; overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; gap: 14px; }
        .post-item {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 12px 16px; display: flex; gap: 14px; align-items: flex-start;
        }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; cursor: pointer; }
        .post-content-box { flex: 1; text-align: left; }
        .post-meta { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .post-author { font-size: 0.9rem; font-weight: bold; color: #fbf5b7; cursor: pointer; }
        .post-time { font-size: 0.75rem; color: #777; }
        .post-text { font-size: 0.95rem; color: #ddd; line-height: 1.4; }

        .admin-action-btn {
            font-size: 0.75rem; color: #ef4444; border: 1px solid #ef4444; border-radius: 4px;
            padding: 1px 6px; cursor: pointer; margin-left: 8px;
        }
        .admin-action-btn:hover { background: #ef4444; color: #fff; }

        .forum-footer { margin-top: 15px; display: flex; gap: 12px; }
        .forum-input {
            flex: 1; padding: 12px 18px; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 30px;
            color: #fff; outline: none; font-size: 0.95rem;
        }
        .send-btn {
            padding: 0 28px; background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 100%);
            color: #0f172a; border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
        }

        /* 4. 相册与个人卡片 */
        .album-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            max-height: 320px; overflow-y: auto; margin-top: 15px;
        }
        .album-item {
            width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3); position: relative;
        }
        .album-item img { width: 100%; height: 100%; object-fit: cover; }
        .album-del-btn {
            position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.9);
            color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px;
            cursor: pointer; font-size: 0.8rem; display: flex; justify-content: center; align-items: center;
        }

        .profile-modal-card { text-align: center; }
        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #d4af37; margin: 0 auto 12px; object-fit: cover; }
        .profile-info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.88rem; }
        .profile-info-label { color: #d4af37; }

        /* 5. 序章对话界面 */
        .prologue-overlay {
            position: fixed; inset: 0; background: #000; z-index: 20000;
            display: none; flex-direction: column; justify-content: flex-end; padding: 40px;
        }
        .prologue-overlay.active { display: flex; }
        .dialog-box {
            background: rgba(15, 23, 42, 0.92); border: 2px solid #d4af37;
            border-radius: 16px; padding: 25px; width: 100%; max-width: 850px; margin: 0 auto; text-align: left;
        }
        .speaker-name { font-size: 1.2rem; color: #d4af37; font-weight: bold; margin-bottom: 10px; }
        .dialog-text { font-size: 1.05rem; line-height: 1.6; color: #f0f0f0; min-height: 60px; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
        .dialog-opt-btn {
            padding: 12px 18px; background: rgba(212, 175, 55, 0.1); border: 1px solid #d4af37;
            color: #fbf5b7; border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .dialog-opt-btn:hover { background: rgba(212, 175, 55, 0.3); }
    </style>
</head>
<body>

    <!-- 落地开场 -->
    <div id="landing-page" class="landing-container">
        <h1 class="art-title">God and the Goat</h1>
        <p class="subtitle">神 与 羊</p>
        <button class="btn" onclick="openRegister()">探索序章 <span style="margin-left: 6px;">→</span></button>
    </div>

    <!-- 账号注册弹窗 -->
    <div id="register-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 class="modal-title">神与羊：序章契约</h2>
        <p class="modal-subtitle">单台设备仅可绑定一个灵魂契约</p>
        <form id="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="reg-nickname">灵魂昵称（具有唯一性）</label>
            <input type="text" id="reg-nickname" placeholder="请输入唯一昵称" required maxlength="16" />
          </div>
          <div class="form-group">
            <label for="reg-race">所属阵营</label>
            <select id="reg-race" required>
              <option value="" disabled selected>-- 请选择你的阵营 --</option>
              <option value="天堂">天堂 (Heaven)</option>
              <option value="人间">人间 (Mortal)</option>
              <option value="地狱">地狱 (Hell)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-email">灵魂邮箱</label>
            <input type="email" id="reg-email" placeholder="name@example.com" required />
          </div>
          <div id="modal-msg" class="msg-box" style="display:none;"></div>
          <button type="submit" class="submit-btn">签订契约并进入</button>
        </form>
      </div>
    </div>

    <!-- 主控制台 -->
    <div id="main-dashboard" class="main-dashboard">
        <!-- 右上角玩家个人栏 -->
        <div class="user-profile-bar" onclick="openProfileCard(currentUser.nickname)">
            <div class="user-details">
                <div class="user-nickname"><span id="user-nickname-display">玩家昵称</span><span id="role-tag-display" class="user-role-tag" style="display:none;">管理者</span></div>
                <div id="user-race-display" class="user-race">阵营</div>
            </div>
            <div class="avatar-wrapper" onclick="event.stopPropagation(); triggerAvatarUpload();">
                <img id="user-avatar-img" class="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=goat" />
                <div class="avatar-hover-tip">修改</div>
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" onchange="handleAvatarChange(event)" />
            <input type="file" id="album-file-input" accept="image/*" onchange="handleAlbumUpload(event)" />
        </div>

        <!-- 毛玻璃菜单网格 -->
        <div class="grid-menu">
            <div class="glass-card large" onclick="openForum()">
                <div class="card-icon">🏛️</div>
                <div class="card-title">万神圣坛 · 论坛</div>
                <div class="card-desc">全服实时交流</div>
            </div>
            <div class="glass-card medium" onclick="openAlbumModal(currentUser.nickname)">
                <div class="card-icon">🖼️</div>
                <div class="card-title">灵魂相册</div>
                <div class="card-desc">展示与管理回忆画廊</div>
            </div>
            <div class="glass-card small" onclick="startPrologueGame(true)">
                <div class="card-icon">📜</div>
                <div class="card-title">重温序章</div>
            </div>
            <div class="glass-card small" onclick="alert('阵营图鉴整理中...')">
                <div class="card-icon">⚔️</div>
                <div class="card-title">阵营圣典</div>
            </div>
            <div class="glass-card small" onclick="alert('系统设置开发中...')">
                <div class="card-icon">⚙️</div>
                <div class="card-title">系统设置</div>
            </div>
        </div>
    </div>

    <!-- 论坛界面 -->
    <div id="forum-modal" class="forum-modal">
        <div class="forum-header">
            <div class="forum-title">🏛️ 万神圣坛论坛 (全服频道)</div>
            <div class="close-btn" onclick="closeForum()">&times;</div>
        </div>
        <div id="forum-body" class="forum-body"></div>
        <div class="forum-footer">
            <input type="text" id="forum-input" class="forum-input" placeholder="撰写发言（按 Enter 或点击发送）..." maxlength="100" onkeydown="if(event.key==='Enter') sendPost()" />
            <button id="send-btn" class="send-btn" onclick="sendPost()">发送</button>
        </div>
    </div>

    <!-- 相册弹窗 -->
    <div id="album-modal" class="modal-overlay">
        <div class="modal-card" style="max-width: 500px;">
            <div class="close-btn" style="position:absolute; top:15px; right:20px;" onclick="closeAlbumModal()">&times;</div>
            <h2 id="album-title" class="modal-title">🖼️ 灵魂相册</h2>
            <p id="album-subtitle" class="modal-subtitle">公开相册</p>
            <button id="album-upload-btn" class="submit-btn" style="margin-bottom: 12px; display:none;" onclick="triggerAlbumUpload()">+ 上传新照片</button>
            <div id="album-grid" class="album-grid"></div>
        </div>
    </div>

    <!-- 个人中心卡片（包含授权管理与强删照片功能） -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-card profile-modal-card">
            <div class="close-btn" style="position:absolute; top:15px; right:20px;" onclick="closeProfileCard()">&times;</div>
            <img id="pf-avatar" class="profile-avatar-large" src="" />
            <h3 id="pf-nickname" style="color:#d4af37; margin-bottom:12px;">-</h3>
            <div class="profile-info-row">
                <span class="profile-info-label">身份权限</span>
                <span id="pf-role" style="color:#eee;">-</span>
            </div>
            <div class="profile-info-row">
                <span class="profile-info-label">契约阵营</span>
                <span id="pf-race" style="color:#eee;">-</span>
            </div>

            <!-- 问彩蝶专属控制权 -->
            <button id="super-admin-reset-avatar-btn" class="submit-btn" style="background:#ef4444; color:#fff; display:none; margin-top:12px;" onclick="superAdminResetAvatar()">🚨 强行重置该玩家头像</button>
            <div id="super-admin-panel" style="display:none; margin-top:15px;">
                <input type="text" id="target-user-input" placeholder="输入玩家昵称" style="width:100%; padding:8px; margin-bottom:8px; background:rgba(255,255,255,0.1); border:1px solid #d4af37; color:#fff; border-radius:6px;" />
                <button onclick="toggleAdminRole()" class="submit-btn" style="padding:8px;">赋予 / 撤销 管理者权限</button>
            </div>
        </div>
    </div>

    <!-- 强制序章幕布 -->
    <div id="prologue-modal" class="prologue-overlay">
        <div id="prologue-skip-btn" class="close-btn" style="position:absolute; top:25px; right:35px; z-index:20001; display:none;" onclick="exitPrologue()">&times; 退出序章</div>
        <div class="dialog-box">
            <div id="speaker-name" class="speaker-name">神秘声音</div>
            <div id="dialog-text" class="dialog-text">...</div>
            <div id="options-container" class="options-container"></div>
        </div>
    </div>

    <script>
    // 绝对超级管理员昵称
    const SUPER_ADMIN_NAME = "问彩蝶";

    let currentUser = null;
    let currentViewingUser = "";
    let pollTimer = null;
    let adminsList = [];
    const DEFAULT_AVATAR = "https://api.dicebear.com/7.x/bottts/svg?seed=goat";

    window.addEventListener('DOMContentLoaded', async () => {
        const savedUser = localStorage.getItem('soul_contract');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            await loadAdminsList();
            checkUserRole();
            if (!currentUser.hasFinishedPrologue) {
                startPrologueGame(false);
            } else {
                enterDashboard();
            }
        }
    });

    async function loadAdminsList() {
        try {
            const res = await fetch('/api/admins');
            if (res.ok) {
                adminsList = await res.json();
            }
        } catch(e) {
            console.error('Failed to load admins:', e);
        }
    }

    function checkUserRole() {
        if (currentUser.nickname === SUPER_ADMIN_NAME) {
            currentUser.role = 'SUPER_ADMIN';
        } else if (adminsList && adminsList.includes(currentUser.nickname)) {
            currentUser.role = 'ADMIN';
        } else {
            currentUser.role = 'USER';
        }
    }

    function showModalMsg(text, type = 'error') {
        const msgEl = document.getElementById('modal-msg');
        if (msgEl) {
            msgEl.innerText = text;
            msgEl.className = `msg-box ${type}`;
            msgEl.style.display = 'block';
        }
    }

    function openRegister() {
        if (currentUser) {
            if (!currentUser.hasFinishedPrologue) startPrologueGame(false);
            else enterDashboard();
            return;
        }
        document.getElementById('register-modal').classList.add('active');
    }

    async function handleRegister(event) {
        event.preventDefault();
        const nickname = document.getElementById('reg-nickname').value.trim();
        const race = document.getElementById('reg-race').value;
        const email = document.getElementById('reg-email').value.trim();

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nickname, race, email })
            });

            const data = await res.json();

            if (data.status === 'error') {
                showModalMsg(data.message, 'error');
                return;
            }

            currentUser = {
                nickname, race, email,
                avatar: data.avatar || DEFAULT_AVATAR,
                hasFinishedPrologue: false,
                album: []
            };

            await loadAdminsList();
            checkUserRole();
            localStorage.setItem('soul_contract', JSON.stringify(currentUser));

            document.getElementById('register-modal').classList.remove('active');
            startPrologueGame(false);
        } catch(e) {
            showModalMsg('注册失败，请重试', 'error');
        }
    }

    function enterDashboard() {
        document.getElementById('landing-page').style.display = 'none';
        document.getElementById('main-dashboard').classList.add('active');
        document.getElementById('user-nickname-display').innerText = currentUser.nickname;
        document.getElementById('user-race-display').innerText = `阵营: ${currentUser.race}`;
        document.getElementById('user-avatar-img').src = currentUser.avatar || DEFAULT_AVATAR;

        const tagEl = document.getElementById('role-tag-display');
        if (tagEl) {
            if (currentUser.role === 'SUPER_ADMIN') {
                tagEl.innerText = '绝对主神'; tagEl.style.display = 'inline-block';
            } else if (currentUser.role === 'ADMIN') {
                tagEl.innerText = '管理者'; tagEl.style.display = 'inline-block';
            } else {
                tagEl.style.display = 'none';
            }
        }
    }

    /* 论坛逻辑 */
    function openForum() {
        fetchAndRenderPosts();
        document.getElementById('forum-modal').classList.add('active');
        if (!pollTimer) pollTimer = setInterval(fetchAndRenderPosts, 2000);
    }

    function closeForum() {
        document.getElementById('forum-modal').classList.remove('active');
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function fetchAndRenderPosts() {
        try {
            const res = await fetch('/api/posts');
            if (res.ok) {
                const posts = await res.json();
                renderPostsUI(posts);
            }
        } catch(e) {
            console.error('Failed to fetch posts:', e);
        }
    }

    function renderPostsUI(posts) {
        const body = document.getElementById('forum-body');
        if (!body) return;
        body.innerHTML = `
            <div class="post-item">
                <img class="post-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=god" />
                <div class="post-content-box">
                    <div class="post-meta">
                        <span class="post-author">创世神谕 [系统]</span>
                        <span class="post-time">全服频道</span>
                    </div>
                    <div class="post-text">点击玩家头像可进入其个人主页与相册！</div>
                </div>
            </div>
        `;

        const canDelete = (currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'ADMIN');

        posts.forEach((p) => {
            const adminControls = canDelete ? `<span class="admin-action-btn" onclick="deletePost(${p.id})">撤回</span>` : '';

            body.insertAdjacentHTML('beforeend', `
                <div class="post-item">
                    <img class="post-avatar" src="${p.avatar || DEFAULT_AVATAR}" onclick="openProfileCard('${escapeHtml(p.nickname)}')" title="点击进入个人主页" />
                    <div class="post-content-box">
                        <div class="post-meta">
                            <span class="post-author" onclick="openProfileCard('${escapeHtml(p.nickname)}')">${escapeHtml(p.nickname)} (${p.race}) ${adminControls}</span>
                            <span class="post-time">${p.time}</span>
                        </div>
                        <div class="post-text">${escapeHtml(p.text)}</div>
                    </div>
                </div>
            `);
        });
        body.scrollTop = body.scrollHeight;
    }

    async function sendPost() {
        const input = document.getElementById('forum-input');
        const btn = document.getElementById('send-btn');
        const text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        btn.innerText = "发送中...";

        const newPost = {
            nickname: currentUser.nickname,
            race: currentUser.race,
            avatar: currentUser.avatar,
            text: text,
            time: new Date().toLocaleTimeString()
        };

        try {
            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPost)
            });

            if (res.ok) {
                input.value = '';
                await fetchAndRenderPosts();
            }
        } catch(e) {
            console.error('Failed to send post:', e);
        }

        setTimeout(() => {
            btn.innerText = '发送';
            btn.disabled = false;
        }, 600);
    }

    async function deletePost(index) {
        if (currentUser.role !== 'SUPER_ADMIN' && currentUser.role !== 'ADMIN') return;

        try {
            const res = await fetch(`/api/posts/${index}`, {
                method: 'POST'
            });

            if (res.ok) {
                await fetchAndRenderPosts();
            }
        } catch(e) {
            console.error('Failed to delete post:', e);
        }
    }

    /* 个人主页与相册功能 */
    function openProfileCard(targetNickname) {
        currentViewingUser = targetNickname || currentUser.nickname;
        const isOwner = (currentViewingUser === currentUser.nickname);
        const isSuperAdmin = (currentUser.role === 'SUPER_ADMIN');

        fetch(`/api/users/${encodeURIComponent(currentViewingUser)}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'error') {
                    alert('用户不存在');
                    return;
                }

                const profile = data.user;

                const pfAvatar = document.getElementById('pf-avatar');
                if (pfAvatar) pfAvatar.src = profile.avatar || DEFAULT_AVATAR;

                const pfNick = document.getElementById('pf-nickname');
                if (pfNick) pfNick.innerText = profile.nickname;

                const pfRace = document.getElementById('pf-race');
                if (pfRace) pfRace.innerText = profile.race;

                const pfRole = document.getElementById('pf-role');
                if (pfRole) {
                    pfRole.innerText = profile.nickname === SUPER_ADMIN_NAME ? '绝对主神' : (adminsList.includes(profile.nickname) ? '管理者' : '普通玩家');
                }

                const resetBtn = document.getElementById('super-admin-reset-avatar-btn');
                if (resetBtn) resetBtn.style.display = (isSuperAdmin && !isOwner) ? 'block' : 'none';

                const panel = document.getElementById('super-admin-panel');
                if (panel) panel.style.display = (isSuperAdmin && isOwner) ? 'block' : 'none';

                const album = profile.album ? JSON.parse(profile.album) : [];
                renderAlbum(album);

                const profModal = document.getElementById('profile-modal');
                if (profModal) profModal.classList.add('active');
            })
            .catch(e => {
                console.error('Failed to load profile:', e);
            });
    }

    function closeProfileCard() { 
        const profModal = document.getElementById('profile-modal');
        if (profModal) profModal.classList.remove('active'); 
    }

    function triggerAlbumUpload() {
        const input = document.getElementById('album-file-input');
        if (input) input.click();
    }

    function handleAlbumUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                if (!currentUser.album) currentUser.album = [];
                currentUser.album.push(e.target.result);
                localStorage.setItem('soul_contract', JSON.stringify(currentUser));

                try {
                    await fetch(`/api/users/${encodeURIComponent(currentUser.nickname)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ album: JSON.stringify(currentUser.album) })
                    });

                    openProfileCard(currentUser.nickname);
                } catch(e) {
                    console.error('Failed to upload album:', e);
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function renderAlbum(albumList) {
        const grid = document.getElementById('album-grid');
        if (!grid) return;
        grid.innerHTML = '';

        const isOwner = (currentViewingUser === currentUser.nickname);
        const isSuperAdmin = (currentUser.role === 'SUPER_ADMIN');

        if (!albumList || albumList.length === 0) {
            grid.innerHTML = '<div style="grid-column:span 3; color:#888; font-size:0.85rem; padding:15px; text-align:center;">暂无相册照片</div>';
            return;
        }

        albumList.forEach((imgSrc, idx) => {
            const canDel = isOwner || isSuperAdmin;
            const delBtn = canDel ? `<button class="album-del-btn" onclick="deleteAlbumImg(${idx})">&times;</button>` : '';

            grid.innerHTML += `
                <div class="album-item">
                    <img src="${imgSrc}" />
                    ${delBtn}
                </div>
            `;
        });
    }

    async function deleteAlbumImg(idx) {
        const isOwner = (currentViewingUser === currentUser.nickname);

        try {
            const res = await fetch(`/api/users/${encodeURIComponent(currentViewingUser)}`);
            const data = await res.json();

            if (data.status === 'error') return;

            const profile = data.user;
            let album = profile.album ? JSON.parse(profile.album) : [];
            album.splice(idx, 1);

            await fetch(`/api/users/${encodeURIComponent(currentViewingUser)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ album: JSON.stringify(album) })
            });

            if (isOwner) {
                currentUser.album = album;
                localStorage.setItem('soul_contract', JSON.stringify(currentUser));
            }

            openProfileCard(currentViewingUser);
        } catch(e) {
            console.error('Failed to delete album image:', e);
        }
    }

    async function superAdminResetAvatar() {
        if (currentUser.role !== 'SUPER_ADMIN') return;

        try {
            await fetch(`/api/users/${encodeURIComponent(currentViewingUser)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ avatar: DEFAULT_AVATAR })
            });

            document.getElementById('pf-avatar').src = DEFAULT_AVATAR;
            alert(`已强行重置玩家 ${currentViewingUser} 的违规头像！`);
        } catch(e) {
            console.error('Failed to reset avatar:', e);
        }
    }

    async function toggleAdminRole() {
        const targetName = document.getElementById('target-user-input').value.trim();
        if (!targetName) return alert('请输入玩家昵称！');

        try {
            const res = await fetch('/api/admins', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nickname: targetName })
            });

            if (res.ok) {
                await loadAdminsList();

                if (adminsList.includes(targetName)) {
                    alert(`已成功赋予 ${targetName} 管理者身份！`);
                } else {
                    alert(`已撤销 ${targetName} 的管理者身份！`);
                }

                document.getElementById('target-user-input').value = '';
            }
        } catch(e) {
            console.error('Failed to toggle admin:', e);
        }
    }

    function triggerAvatarUpload() { 
        const input = document.getElementById('avatar-file-input');
        if (input) input.click();
    }

    function handleAvatarChange(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                currentUser.avatar = e.target.result;
                localStorage.setItem('soul_contract', JSON.stringify(currentUser));
                document.getElementById('user-avatar-img').src = e.target.result;

                try {
                    await fetch(`/api/users/${encodeURIComponent(currentUser.nickname)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ avatar: e.target.result })
                    });
                } catch(e) {
                    console.error('Failed to update avatar:', e);
                }
            };
            reader.readAsDataURL(file);
        }
    }

    /* 序章对话流程 */
    const storyData = {
        start: {
            speaker: "未知迷雾",
            text: "醒来吧，来自...的灵魂。你睁开眼，面前站着一只头顶长着金色羊角、散发着幽光的山羊。",
            options: [
                { label: "你是谁？这里是什么地方？", next: "step1" },
                { label: "（保持警惕，紧握双拳）", next: "step2" }
            ]
        },
        step1: {
            speaker: "神秘山羊",
            text: "我是这片原野的引导者。神已沉睡，而世界的秩序正在崩塌...",
            options: [
                { label: "作为【阵营】的一员，我要重建这片大地！", next: "end" }
            ]
        },
        step2: {
            speaker: "神秘山羊",
            text: "不必戒备，凡人。你的灵魂契约早已注定了你的归宿。",
            options: [
                { label: "顺应契约的召唤", next: "end" }
            ]
        },
        end: {
            speaker: "创世神谕",
            text: "【序章契约试炼完成】你的选择已印入这片土地！",
            options: [
                { label: "完成试炼并进入主菜单", next: "finish" }
            ]
        }
    };

    function startPrologueGame(canSkipManual = false) {
        document.getElementById('prologue-skip-btn').style.display = canSkipManual ? 'block' : 'none';
        document.getElementById('prologue-modal').classList.add('active');
        renderDialogue('start');
    }

    function exitPrologue() { 
        document.getElementById('prologue-modal').classList.remove('active');
        enterDashboard();
    }

    function renderDialogue(nodeKey) {
        if (nodeKey === 'finish') {
            currentUser.hasFinishedPrologue = true;
            localStorage.setItem('soul_contract', JSON.stringify(currentUser));
            exitPrologue();
            return;
        }
        const node = storyData[nodeKey];
        let text = node.text.replace('来自...', `来自【${currentUser.race}】`);
        text = text.replace('【阵营】', currentUser.race);

        document.getElementById('speaker-name').innerText = node.speaker;
        document.getElementById('dialog-text').innerText = text;

        const optBox = document.getElementById('options-container');
        optBox.innerHTML = '';
        node.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'dialog-opt-btn';
            btn.innerText = opt.label;
            btn.onclick = () => renderDialogue(opt.next);
            optBox.appendChild(btn);
        });
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
