<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God and the Goat | God and the Goat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%), url('/static/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Georgia", serif;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        h1.art-title {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: 5px;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4)) drop-shadow(0 8px 16px rgba(0, 0, 0, 0.9));
        }

        p.subtitle {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 45px;
            font-weight: 300;
            letter-spacing: 6px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 42px;
            font-size: 1.05rem;
            font-weight: 500;
            color: #0f172a;
            text-decoration: none;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            background: linear-gradient(135deg, #fbf5b7 0%, #d4af37 100%);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #ffffff 0%, #fbf5b7 100%);
        }

        /* 注册弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 35px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(212, 175, 55, 0.2);
            text-align: center;
        }

        .modal-card h2 {
            color: #d4af37;
            font-size: 1.6rem;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .modal-card p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #d4af37;
            font-size: 0.8rem;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s ease;
        }

        .input-group input:focus {
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1 class="art-title">God and the Goat</h1>
    <p class="subtitle">神 与 山 羊</p>
    
    <button class="btn" onclick="openRegister()">探索序章 <span style="margin-left: 6px;">→</span></button>

    <!-- 强制注册弹窗 -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-card">
            <h2>创建冒险者契约</h2>
            <p>请先完成登记以踏入序章世界</p>
            
            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>用户名 / 称号</label>
                    <input type="text" id="username" placeholder="请输入你的名字" required>
                </div>
                <div class="input-group">
                    <label>电子邮箱</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
                <button type="submit" class="btn submit-btn">签署契约进入</button>
            </form>
        </div>
    </div>

    <script>
        function openRegister() {
            const savedUser = localStorage.getItem('gatg_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                alert(`欢迎回来，尊贵的冒险者：${user.username}！正在载入序章...`);
                // 这里后续可接入真实的序章跳转逻辑，例如：window.location.href = '/prologue.html';
            } else {
                document.getElementById('registerModal').classList.add('active');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            // 本地保存注册信息
            localStorage.setItem('gatg_user', JSON.stringify({ username, email }));

            // 关闭弹窗
            document.getElementById('registerModal').classList.remove('active');

            // 成功提示并开启游戏
            alert(`契约已成！欢迎来到《God and the Goat》的世界，${username}！`);
            // 这里后续同样可接跳转逻辑
        }
    </script>
</body>
</html>
